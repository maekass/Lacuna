name: Promote approved deals

# Manual reviewer path: promote approved staging rows → JSON diff → PR.
on:
  workflow_dispatch:
    inputs:
      deal_id:
        description: Optional lacuna_deals deal_id (omit to promote all approved)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote-approved-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Migrate Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      # Pass workflow inputs via env, never interpolate into `run:` (CodeQL
      # actions/code-injection — a crafted deal_id can break out of the script).
      - name: Promote approved deals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LACUNA_PROMOTE_TARGET: json
          DEAL_ID: ${{ inputs.deal_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEAL_ID}" ]]; then
            npm run deals:promote-approved
            exit 0
          fi
          # Staging deal_ids are `sec-{cik}-{accession}` (see buildDealId).
          if [[ ! "${DEAL_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid deal_id; expected sec-{cik}-{accession}."
            exit 1
          fi
          npm run deals:promote-approved -- --deal-id="${DEAL_ID}"

      - name: Recompute quantitative artifacts
        run: npm run compute:all

      - name: Validate dataset
        run: npm run validate:dataset

      - name: Open PR when verified universe changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/promote-approved-${{ github.run_id }}
          delete-branch: true
          title: "chore: promote approved staging deals to verified JSON"
          commit-message: "chore: promote approved staging deals to verified JSON"
          body: |
            ## Summary
            Promotes reviewer-approved `lacuna_deals` rows into `dataset.verified.json` via the manual **Promote approved deals** workflow.

            ## Checklist
            - [ ] Promotion checklist completed for each deal (dual-source gates)
            - [ ] `npm run validate:dataset` passes in CI
            - [ ] `docs/CHANGELOG_DATASET.md` updated if needed

            Triggered by @${{ github.actor }} (run `${{ github.run_id }}`).
          labels: dataset
