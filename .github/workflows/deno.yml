# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno then run `deno lint` and `deno test`.
# For more information see: https://github.com/denoland/setup-deno

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v1.2.0
        with:
          deno-version: v1.x
          cache: true

      - name: Verify formatting
        # Required by CI — run `deno fmt` locally before pushing.
        run: deno fmt --check

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Validate verified dataset
        run: npm run validate:dataset

      - name: Recompute quantitative artifacts
        run: npm run compute:all

      - name: Verify computed artifacts are current
        run: npm run verify:computed

      - name: Infrastructure check
        run: npm run infra:check

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: Python API tests
        run: |
          python -m pip install -r services/python-api/requirements.txt
          npm run python-api:test

      - name: Deno lint (require-await + no-node-globals)
        run: deno lint src scripts
