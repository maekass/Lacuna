# Fast build gate first, then quality checks + deploy smokes. Vercel should wait for
# `build`, `ci`, and `e2e`. See docs/PRODUCTION_SETUP.md and docs/VERCEL_SETTINGS.md.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck app (src)
        run: npm run typecheck

      - name: Production build (static dataset)
        run: npm run build:ci
        env:
          LACUNA_DATA_MODE: static

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build for smoke tests
        run: npm run build:ci
        env:
          LACUNA_DATA_MODE: static

      - name: Deploy smoke tests
        run: npm run test:e2e:smoke
        env:
          CI: true
          LACUNA_DATA_MODE: static

  ci:
    name: ci
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v1.2.0
        with:
          deno-version: v2.1.4

      - name: Verify formatting
        run: deno fmt --check

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Compliance lint
        run: npm run compliance:lint

      - name: Validate verified dataset
        run: npm run validate:dataset

      - name: Validate patient empowerment catalog
        run: npm run validate:empowerment

      - name: Sweep catalyst watchlist
        run: npm run intel:sweep:check

      - name: Recompute quantitative artifacts
        run: npm run compute:all

      - name: Verify computed artifacts are current
        run: npm run verify:computed

      - name: Verify provenance census
        run: npm run gate:provenance

      - name: Quality-history ratchet
        run: npm run gate:quality-history

      - name: Infrastructure check
        run: npm run infra:check

      - name: Vitest
        run: npm test

      - name: Python API tests
        run: |
          python -m pip install -r services/python-api/requirements.txt
          npm run python-api:test

      - name: Deno lint (require-await + no-node-globals)
        run: deno lint src scripts
