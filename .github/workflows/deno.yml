# Fast build gate first, then quality checks. Vercel should wait for `build` + `ci`.
# See docs/PRODUCTION_SETUP.md and docs/VERCEL_SETTINGS.md.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck app (src)
        run: npm run typecheck

      - name: Production build
        run: npm run build

  ci:
    name: ci
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v1.2.0
        with:
          deno-version: v2.1.4

      - name: Verify formatting
        run: deno fmt --check

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Validate verified dataset
        run: npm run validate:dataset

      - name: Validate patient empowerment catalog
        run: npm run validate:empowerment

      - name: Recompute quantitative artifacts
        run: npm run compute:all

      - name: Verify computed artifacts are current
        run: npm run verify:computed

      - name: Infrastructure check
        run: npm run infra:check

      - name: Vitest
        run: npm test

      - name: Python API tests
        run: |
          python -m pip install -r services/python-api/requirements.txt
          npm run python-api:test

      - name: Deno lint (require-await + no-node-globals)
        run: deno lint src scripts
