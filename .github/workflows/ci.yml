name: Python smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check (dashboard + sickle cell pipeline)
        run: |
          python -m compileall -q \
            dashboard \
            src/data_collection \
            scripts/debug_check.py \
            scripts/playwright_browsers.py \
            scripts/smoke_test_dashboard.py \
            src/models/market_analysis.py \
            src/models/investment_stage_analysis.py \
            src/models/ml_artifacts.py
      - name: Verify bundled demo CSVs
        run: python scripts/debug_check.py
