name: Python smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check (dashboard + sickle cell pipeline)
        run: |
          python -m compileall -q \
            dashboard \
            src/data_collection \
            src/data_collection/parsers \
            src/ontology \
            src/disease_registry \
            src/data_collection/live_trials.py \
            src/data_collection/parsers/orphanet_search.py \
            src/data_collection/parsers/cdc_nndss.py \
            src/data_collection/parsers/openfda_drugsfda.py \
            src/disease_registry/equity_context.py \
            tests \
            scripts/debug_check.py \
            scripts/playwright_browsers.py \
            scripts/smoke_test_dashboard.py \
            src/models/market_analysis.py \
            src/models/investment_stage_analysis.py \
            src/models/ml_artifacts.py \
            src/quant_framework/quant_artifacts.py \
            src/quant_framework/walk_forward.py \
            src/quant \
            src/data_validation \
            scripts/validate_data.py
      - name: Unit tests (parsers, schemas, ontology, validation)
        run: python -m pytest tests/ -q
      - name: Verify bundled demo CSVs
        run: python scripts/debug_check.py
      - name: Data validation
        run: python scripts/validate_data.py
