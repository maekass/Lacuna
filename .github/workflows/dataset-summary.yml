name: Daily dataset summary

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dataset-summary
  cancel-in-progress: false

jobs:
  dataset-summary:
    runs-on: ubuntu-latest
    env:
      # main is protected (changes must go through a pull request), so the
      # daily rows are proposed on this branch instead of pushed to main.
      SYNC_BRANCH: chore/quality-history-sync
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Validate verified dataset
        run: npm run validate:dataset

      - name: Recompute quantitative artifacts
        run: npm run compute:all

      - name: Verify computed artifacts match model
        run: npm run verify:computed

      - name: Refresh payer-ops citation reachability
        id: payer_ops_fetch
        continue-on-error: true
        run: |
          npm run payer-ops:benchmarks:fetch
          echo "::warning::payer-ops:benchmarks:fetch completed; treat unreachable sources as warnings, never a required check."

      - name: Payer-ops fetch summary
        if: always()
        run: |
          {
            echo "## Payer-ops citation fetch"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| payer-ops:benchmarks:fetch | ${{ steps.payer_ops_fetch.outcome }} |"
            echo ""
            echo "Link-rot probes are advisory. A failed fetch must not block the workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append quality history
        run: npm run quality-history:append

      - name: Quality-history ratchet
        run: npm run gate:quality-history

      - name: Quality visibility report
        if: always()
        run: npm run report:quality

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-visibility-daily
          path: |
            src/data/computed-quality-visibility.json
            src/data/computed-data-quality-scores.json
            quality-visibility-report.md
          if-no-files-found: warn

      - name: Propose quality history and payer-ops snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never interpolate github.* into `run:` (CodeQL actions/code-injection).
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git add data/quality-history.jsonl src/data/payer-ops-benchmarks.snapshot.json
          if git diff --cached --quiet; then
            echo "No quality-history or payer-ops snapshot changes to propose."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git commit -m "chore: append quality-history JSONL"
          # Rebuilt from the default branch each run; the lease refuses to
          # overwrite a branch someone else pushed since this checkout.
          git fetch origin "$SYNC_BRANCH" || true
          git push --force-with-lease origin "$SYNC_BRANCH"
          if [ -n "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Updated the open quality-history pull request."
            exit 0
          fi
          if ! gh pr create \
            --draft \
            --head "$SYNC_BRANCH" \
            --base "$DEFAULT_BRANCH" \
            --title "chore: append quality-history JSONL" \
            --body "Automated daily quality-history row and payer-ops citation snapshot from the Daily dataset summary workflow. Review the appended row before merging; it records catalog coverage and data-quality counts, not analytical validity."; then
            compare="https://github.com/${REPOSITORY}/compare/${DEFAULT_BRANCH}...${SYNC_BRANCH}"
            echo "::warning::Pushed ${SYNC_BRANCH} but could not open a pull request. If Actions may not create pull requests in this repository, open one from ${compare}."
            {
              echo "## Quality-history sync"
              echo ""
              echo "Pushed \`${SYNC_BRANCH}\`; pull request creation was refused."
              echo "Open it manually: ${compare}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
