name: Daily dataset summary

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dataset-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Validate verified dataset
        run: npm run validate:dataset

      - name: Recompute quantitative artifacts
        run: npm run compute:all

      - name: Verify computed artifacts match model
        run: npm run verify:computed

      - name: Refresh payer-ops citation reachability
        id: payer_ops_fetch
        continue-on-error: true
        run: |
          npm run payer-ops:benchmarks:fetch
          echo "::warning::payer-ops:benchmarks:fetch completed; treat unreachable sources as warnings, never a required check."

      - name: Payer-ops fetch summary
        if: always()
        run: |
          {
            echo "## Payer-ops citation fetch"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| payer-ops:benchmarks:fetch | ${{ steps.payer_ops_fetch.outcome }} |"
            echo ""
            echo "Link-rot probes are advisory. A failed fetch must not block the workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append quality history
        run: npm run quality-history:append

      - name: Quality-history ratchet
        run: npm run gate:quality-history

      - name: Quality visibility report
        if: always()
        run: npm run report:quality

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-visibility-daily
          path: |
            src/data/computed-quality-visibility.json
            src/data/computed-data-quality-scores.json
            quality-visibility-report.md
          if-no-files-found: warn

      - name: Commit quality history and payer-ops snapshot
        run: |
          git add data/quality-history.jsonl src/data/payer-ops-benchmarks.snapshot.json
          if git diff --cached --quiet; then
            echo "No quality-history or payer-ops snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: append quality-history JSONL [skip ci]"
          git push
