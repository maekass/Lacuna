name: Daily dataset summary

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Validate verified dataset
        run: npm run validate:dataset

      - name: Recompute dataset summary
        run: npm run compute:dataset-summary

      - name: Verify summary artifact matches model
        run: git diff --exit-code src/data/computed-dataset-summary.json
