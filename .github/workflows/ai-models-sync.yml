name: Daily AI model metadata sync

# Keeps pricing, context window, and knowledge cutoff current in
# src/data/ai-models.snapshot.json so LLM cost accounting does not drift.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ai-models-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Sync gateway model metadata
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: npm run ai:models:sync

      - name: Commit when model metadata changed
        run: |
          if git diff --quiet src/data/ai-models.snapshot.json; then
            echo "Model metadata unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ai-models.snapshot.json
          git commit -m "chore: sync AI model metadata snapshot"
          git push
