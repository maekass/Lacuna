name: MeshIC Data Integrity

on:
  pull_request:
    paths:
      - "src/data/**"
      - "src/lib/data/**"
      - "src/lib/evidence/**"
      - "src/lib/lineage/**"
      - "src/lib/impact/**"
      - "src/lib/quant/**"
      - "src/lib/scoring/**"
      - "src/lib/deals/**"
      - "src/components/ExitPredictor.tsx"
      - "src/components/PitchBrief.tsx"
      - "src/components/QuantValuationPanel.tsx"
      - "src/components/AcquirerPredictionDashboard.tsx"
      - "src/components/CompanySimilarity.tsx"
      - "src/components/DataQualityVisibility.tsx"
      - "scripts/**"
      - "staging/**"
      - "docs/DATA_CURATION_CHECKLIST.md"
      - "docs/DATA_BOUNDARIES.md"
      - "docs/LEAKAGE_AUDIT.md"
      - "docs/MESHIC_DATA_AUDIT.md"
      - "docs/NEW_DEAL_WORKFLOW.md"
      - "docs/EVIDENCE_GRAPH.md"
      - "docs/INFERENCE.md"
      - "docs/LIMITATIONS.md"
      - ".github/workflows/meshic-data-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Schema and evidence hygiene
        run: npm run validate:dataset

      - name: MeshIC strict provenance and historical-replay gate
        run: npx tsx scripts/meshic-data-gate.ts --strict

      - name: Computed artifact lineage
        run: npm run verify:computed
