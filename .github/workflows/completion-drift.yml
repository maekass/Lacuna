name: Completion model drift

# Weekly PSI drift check for the served completion-proxy champion
# (services/python-api/model_registry/completion). Pulls recently updated
# ClinicalTrials.gov trials (public API, no secrets), compares feature and
# prediction-score distributions against the committed training reference,
# and fails when any PSI exceeds 0.20. See docs/ML_CLINICAL_TRIALS.md.

on:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC
  workflow_dispatch:
    inputs:
      since_days:
        description: "Look-back window (days of LastUpdatePostDate)"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: completion-drift
  cancel-in-progress: false

jobs:
  drift:
    name: completion-psi-drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/clinical_trials/requirements.txt
            services/python-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/clinical_trials/requirements.txt
          # Same scikit-learn minor as the served artifact.
          python -m pip install -r services/python-api/requirements.txt

      - name: Drift unit tests
        run: |
          PYTHONPATH=ml/clinical_trials python -m unittest \
            ml/clinical_trials/tests/test_completion_production.py -v

      - name: PSI drift check vs training snapshot
        env:
          SINCE_DAYS: ${{ github.event.inputs.since_days || '30' }}
        run: |
          PYTHONPATH=ml/clinical_trials python \
            ml/clinical_trials/scripts/check_completion_drift.py \
            --since-days "$SINCE_DAYS"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completion-drift-report
          path: ml/clinical_trials/output/drift/completion-drift-report.json
          if-no-files-found: warn
          retention-days: 30
