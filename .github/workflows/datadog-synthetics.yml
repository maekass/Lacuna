# Optional Datadog Synthetic CI gate — manual only until keys are configured.
# GitHub Actions does not allow `secrets.*` in job-level `if` (workflow would fail at parse time).
#
# Setup:
# 1. Add repository secrets DD_API_KEY and DD_APP_KEY.
# 2. Run this workflow from Actions → "Run Datadog Synthetic tests" → Run workflow.

name: Run Datadog Synthetic tests

on:
  workflow_dispatch:

jobs:
  synthetics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
