name: OpenAlex integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: OpenAlex provider integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify OpenAlex secret is available
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "${OPENALEX_API_KEY:-}" ]; then
            echo "OPENALEX_API_KEY is not configured for this repository."
            exit 1
          fi

      - name: Unit integrity contract
        run: npx vitest run src/lib/ingestion/openAlexClient.test.ts

      - name: Lint
        run: npm run lint

      - name: Deno format check
        run: npm run deno:fmt:check

      - name: Deno lint
        run: npm run deno:lint

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build:ci

      - name: Authenticated OpenAlex integrity probe
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: npx tsx scripts/openalex-smoke.ts
