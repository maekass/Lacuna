name: Informatics cohort tests

on:
  pull_request:
    paths:
      - "ml/informatics/**"
      - ".github/workflows/informatics.yml"
  push:
    branches: ["main"]
    paths:
      - "ml/informatics/**"
      - ".github/workflows/informatics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  informatics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ml/informatics/requirements.txt
      - run: python -m pytest -q ml/informatics/tests
