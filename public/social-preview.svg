<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sophisticated rose-to-plum gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c97b7e"/>
      <stop offset="30%" style="stop-color:#a68bc8"/>
      <stop offset="70%" style="stop-color:#7a6fa8"/>
      <stop offset="100%" style="stop-color:#4a3f6b"/>
    </linearGradient>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white" opacity="0.1"/>
    </pattern>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  
  <!-- Decorative network nodes (subtle) -->
  <g opacity="0.15">
    <circle cx="200" cy="150" r="8" fill="white"/>
    <circle cx="350" cy="200" r="6" fill="white"/>
    <circle cx="280" cy="300" r="10" fill="white"/>
    <line x1="200" y1="150" x2="350" y2="200" stroke="white" stroke-width="1"/>
    <line x1="350" y1="200" x2="280" y2="300" stroke="white" stroke-width="1"/>
    
    <circle cx="1000" cy="400" r="8" fill="white"/>
    <circle cx="1150" cy="350" r="6" fill="white"/>
    <circle cx="1080" cy="500" r="10" fill="white"/>
    <line x1="1000" y1="400" x2="1150" y2="350" stroke="white" stroke-width="1"/>
    <line x1="1150" y1="350" x2="1080" y2="500" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Main content group -->
  <g transform="translate(640, 320)">
    <!-- Elegant L Logo -->
    <g transform="translate(-50, -150)">
      <rect x="0" y="0" width="100" height="100" rx="20" fill="white" opacity="0.9"/>
      <text x="50" y="72" font-family="'Playfair Display', 'Times New Roman', serif" font-size="60" font-weight="400" font-style="italic" fill="#4a3f6b" text-anchor="middle" style="font-family: Georgia, 'Times New Roman', serif; font-style: italic;">L</text>
    </g>
    
    <!-- Lacuna title - elegant cursive -->
    <text x="0" y="20" font-family="'Playfair Display', 'Cormorant Garamond', 'Times New Roman', serif" font-size="84" font-weight="400" font-style="italic" fill="white" text-anchor="middle" letter-spacing="2" style="font-family: 'Brush Script MT', 'Edwardian Script ITC', 'Snell Roundhand', cursive;">Lacuna</text>
    
    <!-- Tagline - refined serif -->
    <text x="0" y="75" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="26" font-weight="300" fill="white" opacity="0.95" text-anchor="middle" letter-spacing="1" style="font-family: Georgia, 'Times New Roman', serif; font-style: italic;">M&amp;A Intelligence for Women&apos;s Health</text>
    
    <!-- Subtitle - elegant light -->
    <text x="0" y="115" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="16" font-weight="300" fill="white" opacity="0.8" text-anchor="middle" letter-spacing="0.5" style="font-family: Georgia, 'Times New Roman', serif;">Network visualization · ML-powered insights · FemTech analytics</text>
  </g>
  
  <!-- Bottom badge -->
  <g transform="translate(640, 580)">
    <rect x="-120" y="-20" width="240" height="40" rx="20" fill="white" opacity="0.15"/>
    <text x="0" y="6" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="14" font-weight="400" fill="white" opacity="0.9" text-anchor="middle" style="font-family: Georgia, 'Times New Roman', serif; font-style: italic;">Educational Project · 2026</text>
  </g>
  
  <!-- Corner accents -->
  <circle cx="60" cy="60" r="30" fill="white" opacity="0.05"/>
  <circle cx="1220" cy="580" r="40" fill="white" opacity="0.05"/>
</svg>
