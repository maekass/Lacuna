<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pink-to-purple gradient matching the app -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white" opacity="0.1"/>
    </pattern>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  
  <!-- Decorative network nodes (subtle) -->
  <g opacity="0.15">
    <circle cx="200" cy="150" r="8" fill="white"/>
    <circle cx="350" cy="200" r="6" fill="white"/>
    <circle cx="280" cy="300" r="10" fill="white"/>
    <line x1="200" y1="150" x2="350" y2="200" stroke="white" stroke-width="1"/>
    <line x1="350" y1="200" x2="280" y2="300" stroke="white" stroke-width="1"/>
    
    <circle cx="1000" cy="400" r="8" fill="white"/>
    <circle cx="1150" cy="350" r="6" fill="white"/>
    <circle cx="1080" cy="500" r="10" fill="white"/>
    <line x1="1000" y1="400" x2="1150" y2="350" stroke="white" stroke-width="1"/>
    <line x1="1150" y1="350" x2="1080" y2="500" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Main content group -->
  <g transform="translate(640, 320)">
    <!-- Logo icon -->
    <g transform="translate(-40, -140)">
      <rect x="0" y="0" width="80" height="80" rx="16" fill="white" opacity="0.95"/>
      <text x="40" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#7c3aed" text-anchor="middle">L</text>
    </g>
    
    <!-- Lacuna title -->
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">Lacuna</text>
    
    <!-- Tagline -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="white" opacity="0.95" text-anchor="middle">M&amp;A Intelligence for Women&apos;s Health</text>
    
    <!-- Subtitle -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="300" fill="white" opacity="0.75" text-anchor="middle">Network visualization · ML-powered insights · FemTech analytics</text>
  </g>
  
  <!-- Bottom badge -->
  <g transform="translate(640, 580)">
    <rect x="-120" y="-20" width="240" height="40" rx="20" fill="white" opacity="0.15"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="white" opacity="0.9" text-anchor="middle">Educational Project · 2026</text>
  </g>
  
  <!-- Corner accents -->
  <circle cx="60" cy="60" r="30" fill="white" opacity="0.05"/>
  <circle cx="1220" cy="580" r="40" fill="white" opacity="0.05"/>
</svg>
