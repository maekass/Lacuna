# Local Postgres + ClickHouse for db mode and variant call-set catalog.
# Start: docker compose up -d
# Then: cp .env.example .env.local && npm run db:migrate && npm run db:import
# Variant store: docker compose --profile genomics up -d
#   npm run clickhouse:migrate && npm run clickhouse:seed

services:
  postgres:
    image: postgres:16-alpine
    container_name: lacuna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lacuna
      POSTGRES_PASSWORD: lacuna
      POSTGRES_DB: lacuna
    ports:
      - "5432:5432"
    volumes:
      - lacuna_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacuna -d lacuna"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    profiles: ["genomics"]
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: lacuna-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: lacuna
      CLICKHOUSE_USER: lacuna
      CLICKHOUSE_PASSWORD: lacuna
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - lacuna_ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest-worker:
    profiles: ["genomics"]
    build:
      context: .
      dockerfile: Dockerfile.ingest
    container_name: lacuna-ingest-worker
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      LACUNA_VARIANT_STORE: clickhouse
      CLICKHOUSE_URL: http://lacuna:lacuna@clickhouse:8123
      CLICKHOUSE_DATABASE: lacuna
      LACUNA_OBJECT_STORAGE: local
      LACUNA_OBJECT_STORAGE_LOCAL_ROOT: /data/variants
      LACUNA_INGEST_CONSENT_REF: ${LACUNA_INGEST_CONSENT_REF:-local-dev-consent}
    volumes:
      - ./data/variants:/data/variants
      - ./data/ingest:/ingest:ro

  python-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: services/python-api/Dockerfile
    container_name: lacuna-python-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LACUNA_DATASET_PATH: /app/src/data/dataset.verified.json
      DATABASE_URL: postgresql://lacuna:lacuna@postgres:5432/lacuna
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lacuna_pg_data:
  lacuna_ch_data:
